networks:
  sriracha:

services:
  sriracha:
    depends_on:
      - sriracha_db
      - httpd
    image: tslocum/sriracha # Use latest official Sriracha image.
    pull_policy: daily # Check for updates daily.
#    build: . # Uncomment to use locally built image instead.
    container_name: sriracha
    restart: always
    user: 1000:1000
    networks:
      - sriracha
    volumes:
      - /home/sriracha/etc:/etc/sriracha # Configuration drectory containing config.yml
      - /home/sriracha/public:/public # Root directory containing board files.
    command: --config /etc/sriracha/config.yml /usr/share/sriracha/plugin # Load all plugins.

  sriracha_db:
    image: postgres:18.1-alpine # https://hub.docker.com/_/postgres/tags
    container_name: sriracha_db
    restart: always
    user: 70:70
    networks:
      - sriracha
    volumes:
      - /home/sriracha/db:/var/lib/postgresql/data # Database directory containing PostgreSQL data.
    environment:
      - POSTGRES_USER=sriracha
      - POSTGRES_PASSWORD=hunter42
      - POSTGRES_DB=sriracha

  httpd:
    image: caddy:2.10.2-alpine # https://hub.docker.com/_/caddy/tags
    container_name: httpd
    restart: always
    user: 1000:1000
    networks:
      - sriracha
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /home/httpd/etc:/config/caddy # Caddy configuration directory containing Caddyfile.
      - /home/sriracha/public:/mnt/sriracha # Root directory containing board files.
    command:
      caddy run --config=/config/caddy/Caddyfile
