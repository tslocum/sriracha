networks:
  sriracha:

services:
  sriracha:
    depends_on:
      - sriracha_db
      - httpd
    image: tslocum/sriracha # Use latest official Sriracha image.
    pull_policy: daily # Check for updates daily.
#    build: . # Uncomment to use locally built image instead.
    container_name: sriracha
    restart: always
    user: 1000:1000
    networks:
      - sriracha
    volumes:
      - /home/sriracha/etc:/etc/sriracha # Configuration drectory containing config.yml
      - /home/sriracha/public:/public # Root directory containing board files.
    command: --config /etc/sriracha/config.yml

  sriracha_db:
    image: postgres:18.4-alpine # https://hub.docker.com/_/postgres/tags
    container_name: sriracha_db
    restart: always
    user: 70:70
    networks:
      - sriracha
    volumes:
      - /home/sriracha/db:/var/lib/postgresql/data # Database directory containing PostgreSQL data.
    environment:
      - POSTGRES_USER=sriracha
      - POSTGRES_PASSWORD=hunter42
      - POSTGRES_DB=sriracha
    # Note: See the Performance section of the Sriracha Manual for optimal configuration values.
    # The example values below are appropriate for a system with 2 GB of available memory (RAM).
    command: postgres -c shared_buffers=512MB -c work_mem=16MB -c maintenance_work_mem=512MB

  httpd:
    image: caddy:2.11.4-alpine # https://hub.docker.com/_/caddy/tags
    container_name: httpd
    restart: always
    user: 1000:1000
    networks:
      - sriracha
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /home/httpd/etc:/config/caddy # Caddy configuration directory containing Caddyfile.
      - /home/sriracha/public:/mnt/sriracha # Root directory containing board files.
    command: caddy run --config=/config/caddy/Caddyfile
