version: 2
project_name: sriracha
builds:
  -
    id: sriracha
    main: ./cmd/sriracha/
    flags:
      - -trimpath
    ldflags:
      - -s -w -X codeberg.org/tslocum/sriracha.SrirachaVersion={{.Version}}
    goos:
      - darwin
      - freebsd
      - linux
    goarch:
      - 386
      - amd64
      - arm
      - arm64
      - loong64
      - ppc64le
      - riscv64
      - s390x
    ignore:
      - goos: freebsd
        goarch: 386
      - goos: freebsd
        goarch: arm
archives:
  -
    ids:
      - sriracha
    wrap_in_directory: sriracha
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- tolower .Os }}_
      {{- if eq .Arch "386" }}i386{{ else }}
      {{- tolower .Arch }}{{ end -}}
    files:
      - ./*.md
      - CHANGELOG
      - LICENSE
      - static
      - src: internal/server/template
        dst: template
checksum:
  name_template: 'checksums.txt'
